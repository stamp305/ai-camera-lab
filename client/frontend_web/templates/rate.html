{% extends "layout_navbar.html" %}
{% block title %}Service Area - AI Camera{% endblock %}
{% block crumb_parent %}Detection Setup{% endblock %}
{% block crumb_current %}Service Area{% endblock %}

{% block content %}<div id="zone-editor"></div>{% endblock %}

{% block scripts %}
{{ super() }}
<script src="/static/js/shape_tools.js?v={{ range(1, 1000000) | random }}"></script>
<script src="/static/js/zone_editor.js?v={{ range(1, 1000000) | random }}"></script>
<script>
ZoneEditor.mount(document.getElementById('zone-editor'), {
    title: 'Service Area',
    subtitle: 'Mark where customers show interest and where staff serve them',
    svc: 'rate_service',
    serviceName: 'rate',
    types: [{ value: 'interest', label: 'Interest' }, { value: 'employee', label: 'Employee' }],
    tag: (p) => p.type === 'employee' ? 'Employee' : 'Interest',
});
</script>
{% endblock %}
