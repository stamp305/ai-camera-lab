{% extends "base.html" %}
{% block title %}เช็คการเชื่อมต่อ - AI Camera{% endblock %}

{% block body %}
<div id="connection-page" class="flex h-screen items-center justify-center bg-gray-50">
    <!-- Loading state -->
    <div id="state-loading" class="flex items-center gap-4 p-8 bg-white rounded-lg shadow-md">
        <div class="spinner"></div>
        <h1 class="text-2xl font-semibold text-gray-700">Checking server status...</h1>
    </div>

    <!-- Offline state -->
    <div id="state-offline" class="hidden" style="flex-direction:column;align-items:center;text-align:center;gap:1rem;padding:2rem;background:white;border-radius:var(--radius);box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">
        <div style="width:2.5rem;height:2.5rem;background:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </div>
        <h1 class="text-2xl font-semibold text-red-600">Server is not available</h1>
        <p class="text-gray-500">Retrying automatically. You will be redirected when the server is back online.</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(async function() {
    const PING_INTERVAL_MS = 10000;
    const loadingEl = document.getElementById('state-loading');
    const offlineEl = document.getElementById('state-offline');

    async function check() {
        const isOnline = await checkServerStatus();
        if (isOnline) {
            try {
                const res = await fetch(`${getApiUrl()}/users/activated-status`);
                if (res.ok) {
                    const data = await res.json();
                    if (!data.is_activated) {
                        sessionStorage.removeItem('userData');
                    }
                }
            } catch (e) {
                console.error("Failed to check backend status", e);
            }
            window.location.href = appUrl('/landing');
            return true;
        } else {
            loadingEl.classList.add('hidden');
            offlineEl.style.display = 'flex';
            return false;
        }
    }

    // Run immediately
    const online = await check();
    if (online) return;

    // Then retry every 10 seconds
    setInterval(check, PING_INTERVAL_MS);
})();
</script>
{% endblock %}
